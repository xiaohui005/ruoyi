        quartz:
          # Scheduler 閻╃鍙ч柊宥囩枂
          scheduler:
            instanceName: schedulerName
            instanceId: AUTO # 閼奉亜濮╅悽鐔稿灇 instance ID
          # JobStore 閻╃鍙ч柊宥囩枂
          jobStore:
            # JobStore 鐎圭偟骞囩猾姹団偓鍌氬讲鐟欎礁宕ョ€诡澁绱癶ttps://blog.csdn.net/weixin_42458219/article/details/122247162
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            isClustered: true # 閺勵垶娉︾紘銈喣佸?
