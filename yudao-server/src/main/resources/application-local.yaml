            misfireThreshold: 60000 # misfire 闂冣偓閸婄》绱濋崡鏇氱秴閿涙碍顕犵粔鎺嬧偓?
          # 缁捐法鈻煎Ч鐘垫祲閸忔娊鍘ょ純?
          threadPool:
            threadCount: 25 # 缁捐法鈻煎Ч鐘层亣鐏忓繈鈧倿绮拋銈勮礋 10 閵?
            threadPriority: 5 # 缁捐法鈻兼导妯哄帥缁?
            class: org.quartz.simpl.SimpleThreadPool # 缁捐法鈻煎Ч鐘佃閸?
    jdbc: # 娴ｈ法鏁?JDBC 閻?JobStore 閻ㄥ嫭妞傞崐娆欑礉JDBC 閻ㄥ嫰鍘ょ純?
