    job-store-type: jdbc # Job 鐎涙ê鍋嶉崳銊ц閸ㄥ鈧倿绮拋銈勮礋 memory 鐞涖劎銇氶崘鍛摠閿涘苯褰查柅?jdbc 娴ｈ法鏁ら弫鐗堝祦鎼存挶鈧?
