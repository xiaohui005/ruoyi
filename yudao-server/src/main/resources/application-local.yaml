    properties: # 濞ｈ濮?Quartz Scheduler 闂勫嫬濮炵仦鐐粹偓褝绱濋弴鏉戭樋閸欘垯浜掗惇?http://www.quartz-scheduler.org/documentation/2.4.0-SNAPSHOT/configuration.html 閺傚洦銆?
